<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShield</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header>
        <h1>🛡️ CyberShield</h1>
        <p>Password Security Toolkit</p>
    </header>

    <main>

        <section class="card">
            <h2>🔍 Password Analyzer</h2>

            <input type="password" id="password" placeholder="Enter your password">

            <button onclick="analyzePassword()">
                Analyze Password
            </button>

            <div id="result"></div>
        </section>

        <section class="card">
            <h2>🎲 Password Generator</h2>

            <input type="number" id="length" value="12" min="8">

            <button onclick="generatePassword()">
                Generate Password
            </button>

            <div id="generated"></div>
        </section>

        <section class="card">
            <h2>#️⃣ SHA-256 Hash Generator</h2>

            <input type="text" id="hashInput" placeholder="Enter text">

            <button onclick="generateHash()">
                Generate Hash
            </button>

            <div id="hashResult"></div>
        </section>

    </main>

    <footer>
        <p>CyberShield • Cybersecurity Toolkit</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
